<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>סטודיו לסדנאות אמנות — חגית אבידן</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e17; --surface: #1a1928; --card: #22213a; --border: #2e2d4a;
    --text: #fffffe; --muted: #a7a9be;
    --c1: #ff8906; --c1t: #0f0e17;
    --c2: #9b5de5; --c2t: #fff;
    --c3: #00b4d8; --c3t: #0f0e17;
    --t1: #ffd166; --t1t: #0f0e17;
    --t2: #ef233c; --t2t: #fff;
    --t3: #80ffdb; --t3t: #0f0e17;
    --f1: #ff99c8; --f1t: #0f0e17;
    --f2: #a8dadc; --f2t: #0f0e17;
    --f3: #e9c46a; --f3t: #0f0e17;
    --holiday: #e53170; --brk: #555570; --skip: #3a1a1a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Heebo', sans-serif; background: var(--bg); color: var(--text); direction: rtl; padding-top: 52px; }

  /* NAVBAR */
  .navbar {
    position: fixed; top: 0; right: 0; left: 0; z-index: 100;
    background: rgba(15,14,23,0.96); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 16px; height: 52px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-brand { font-size: 0.85rem; font-weight: 700; color: var(--text); }
  .nav-brand span { color: var(--c1); }
  .nav-links { display: flex; gap: 4px; }
  .nav-link {
    padding: 5px 11px; border-radius: 20px; font-size: 0.73rem; font-weight: 500;
    color: var(--muted); cursor: pointer; border: 1px solid transparent;
    background: transparent; font-family: 'Heebo', sans-serif;
    transition: all 0.2s; text-decoration: none; display: inline-block;
  }
  .nav-link:hover { color: var(--text); border-color: var(--border); }
  .nav-link.active { color: var(--c1); border-color: var(--c1); background: rgba(255,137,6,0.08); }

  /* HERO */
  .hero { padding: 56px 20px 44px; text-align: center; border-bottom: 1px solid var(--border); }
  .hero h1 {
    font-size: clamp(1.8rem, 7vw, 3.2rem); font-weight: 900; line-height: 1.1; margin-bottom: 12px;
    background: linear-gradient(135deg, var(--c1), var(--c2), var(--c3));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .hero p { color: var(--muted); font-size: 0.9rem; font-weight: 300; max-width: 480px; margin: 0 auto 28px; line-height: 1.7; }
  .hero-badges { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .badge { padding: 5px 13px; border-radius: 20px; font-size: 0.73rem; font-weight: 600; border: 1px solid var(--border); color: var(--muted); background: var(--surface); }

  /* WORKSHOPS SECTION */
  .workshops-section { padding: 44px 16px; max-width: 1000px; margin: 0 auto; }
  .sec-label { font-size: 0.62rem; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: var(--muted); text-align: center; margin-bottom: 24px; }

  .wcard {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; margin-bottom: 14px;
    transition: transform 0.2s, box-shadow 0.2s;
    cursor: pointer;
  }
  .wcard:hover { transform: translateY(-2px); box-shadow: 0 8px 40px rgba(0,0,0,0.35); }
  .wcard:hover .wcard-header { opacity: 0.95; }

  .wcard-header {
    display: flex; align-items: center; gap: 14px; padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .wcard-icon { font-size: 1.5rem; flex-shrink: 0; }
  .wcard-titles { flex: 1; }
  .wcard-name { font-size: 0.98rem; font-weight: 800; color: var(--text); line-height: 1.2; }
  .wcard-sub { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
  .wcard-time { font-size: 0.68rem; font-weight: 700; padding: 4px 10px; border-radius: 8px; white-space: nowrap; flex-shrink: 0; }
  .wcard-hint { font-size: 0.62rem; color: var(--muted); padding: 4px 12px 0; opacity: 0.6; text-align: left; }

  .wcard-body { padding: 16px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .wcard-desc { font-size: 0.83rem; font-weight: 300; color: var(--muted); line-height: 1.75; grid-column: 1 / -1; }
  .wcard-col-title { font-size: 0.6rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 9px; }
  .wcard-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .wcard-list li { font-size: 0.79rem; color: var(--text); display: flex; align-items: flex-start; gap: 8px; line-height: 1.4; }
  .wcard-list li::before { content: "·"; color: var(--muted); flex-shrink: 0; }

  .wc1 .wcard-header { border-right: 4px solid var(--c1); }
  .wc1 .wcard-time { background: rgba(255,137,6,0.15); color: var(--c1); }
  .wc2 .wcard-header { border-right: 4px solid var(--t1); }
  .wc2 .wcard-time { background: rgba(255,209,102,0.15); color: var(--t1); }
  .wc3 .wcard-header { border-right: 4px solid var(--c2); }
  .wc3 .wcard-time { background: rgba(155,93,229,0.15); color: var(--c2); }
  .wc4 .wcard-header { border-right: 4px solid var(--f1); }
  .wc4 .wcard-time { background: rgba(255,153,200,0.15); color: var(--f1); }

  @media (max-width: 600px) { .wcard-body { grid-template-columns: 1fr; } }

  /* CALENDAR SECTION */
  .cal-wrapper { padding: 44px 16px; background: var(--bg); border-top: 1px solid var(--border); }
  .cal-header { text-align: center; margin-bottom: 22px; }
  .cal-header h2 {
    font-size: clamp(1.4rem, 5vw, 2.4rem); font-weight: 900;
    background: linear-gradient(135deg, var(--c1), var(--c2), var(--c3), var(--t1));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    margin-bottom: 4px;
  }
  .cal-header p { color: var(--muted); font-size: 0.85rem; }

  .banners { display: flex; flex-direction: column; gap: 10px; max-width: 680px; margin: 0 auto 22px; }
  .banner { display: flex; border-radius: 11px; overflow: hidden; border: 1px solid var(--border); }
  .banner-label { padding: 10px 12px; font-size: 0.78rem; font-weight: 900; display: flex; align-items: center; justify-content: center; white-space: nowrap; min-width: 72px; }
  .banner-label.wed { background: #1a1430; color: var(--c1); border-left: 3px solid var(--c1); }
  .banner-label.thu { background: #0f2820; color: var(--t1); border-left: 3px solid var(--t1); }
  .banner-label.fri { background: #2a1a2a; color: var(--f1); border-left: 3px solid var(--f1); }
  .banner-slots { display: flex; flex: 1; }
  .bslot { flex: 1; padding: 10px 6px; text-align: center; font-weight: 700; line-height: 1.4; }
  .bslot .hour { font-size: 0.92rem; font-weight: 900; display: block; }
  .bslot .name { font-size: 0.62rem; opacity: 0.88; }
  .bs1 { background: var(--c1); color: var(--c1t); }
  .bs-brk { background: var(--brk); color: #ccc; flex: 0.5 !important; }
  .bs2 { background: #3da9fc; color: #0f0e17; }
  .bs-end { background: #1a1928; color: #a7a9be; flex: 0.4 !important; }
  .bs-thu { background: var(--t1); color: var(--t1t); }
  .bs-fri { background: var(--f1); color: var(--f1t); }

  .legend { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin-bottom: 22px; }
  .legend-item {
    display: flex; align-items: center; gap: 5px; font-size: 0.73rem; color: var(--muted);
    background: var(--surface); padding: 4px 9px; border-radius: 20px; border: 1px solid var(--border);
    cursor: pointer; transition: border-color 0.2s, transform 0.15s;
  }
  .legend-item:hover { border-color: #fff; transform: scale(1.05); }
  .ldot { width: 9px; height: 9px; border-radius: 50%; }

  .months-wrapper { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; max-width: 1300px; margin: 0 auto; }
  .month-card { background: var(--surface); border: 1px solid var(--border); border-radius: 13px; overflow: hidden; }
  .month-header { background: var(--card); padding: 11px 15px; font-size: 0.92rem; font-weight: 700; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .month-header .heb { font-size: 0.7rem; font-weight: 400; color: var(--muted); }
  .cal-grid { direction: ltr; display: grid; grid-template-columns: repeat(7, 1fr); padding: 7px; gap: 3px; }
  .wd { text-align: center; padding: 5px 2px; font-size: 0.63rem; font-weight: 600; color: var(--muted); }
  .wd.wed-col { color: var(--c1); font-weight: 800; }
  .wd.thu-col { color: var(--t1); font-weight: 800; }
  .wd.fri-col { color: var(--f1); font-weight: 800; }

  .day { border-radius: 6px; font-size: 0.75rem; position: relative; }
  .day.plain { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; text-align: center; }
  .day.has-data { padding: 3px 2px; min-height: 68px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px; cursor: pointer; }
  .day.has-data:hover { filter: brightness(1.15); }
  .day.empty { background: transparent; }
  .day.is-sat { color: #55556a; }
  .day.is-fri-day { color: #77778a; }
  .day.hol.plain { outline: 2px solid var(--holiday); outline-offset: -2px; color: #ff6090; }
  .day.cy1 { background: var(--c1); color: var(--c1t); font-weight: 700; }
  .day.cy2 { background: var(--c2); color: var(--c2t); font-weight: 700; }
  .day.cy3 { background: var(--c3); color: var(--c3t); font-weight: 700; }
  .day.th1 { background: var(--t1); color: var(--t1t); font-weight: 700; }
  .day.th2 { background: var(--t2); color: var(--t2t); font-weight: 700; }
  .day.th3 { background: var(--t3); color: var(--t3t); font-weight: 700; }
  .day.fr1 { background: var(--f1); color: var(--f1t); font-weight: 700; }
  .day.fr2 { background: var(--f2); color: var(--f2t); font-weight: 700; }
  .day.fr3 { background: var(--f3); color: var(--f3t); font-weight: 700; }
  .day.brk { background: var(--brk); color: #bbb; outline: 2px dashed #888; outline-offset: -2px; }
  .day.skip { background: var(--skip); color: #884444; outline: 2px solid var(--holiday); outline-offset: -2px; }
  .day.hol.has-data { outline: 2px solid var(--holiday); outline-offset: -2px; }
  .cell-date { font-size: 0.82rem; font-weight: 900; line-height: 1; }
  .cell-time { font-size: 0.49rem; opacity: 0.75; line-height: 1; }
  .cell-name { font-size: 0.52rem; font-weight: 700; line-height: 1.2; text-align: center; }
  .cell-lesson { font-size: 0.49rem; opacity: 0.7; line-height: 1; }
  .cell-hol { font-size: 0.47rem; background: rgba(229,49,112,0.25); border-radius: 3px; padding: 1px 3px; color: #ff90b3; width: 100%; text-align: center; }
  .day.cy1 .cell-hol,.day.cy3 .cell-hol,.day.th1 .cell-hol,.day.fr1 .cell-hol { background: rgba(0,0,0,0.15); color: rgba(0,0,0,0.55); }
  .cell-hanukkah { font-size: 0.47rem; background: rgba(100,200,80,0.25); border-radius: 3px; padding: 1px 3px; color: #aedd88; width: 100%; text-align: center; }
  .day.cy1 .cell-hanukkah,.day.th1 .cell-hanukkah { background: rgba(0,0,0,0.12); color: rgba(0,0,0,0.6); }
  .cell-skip { font-size: 0.49rem; color: #cc6666; text-align: center; }
  .note { max-width: 1300px; margin: 16px auto 0; background: rgba(100,180,50,0.08); border: 1px solid rgba(100,180,50,0.3); border-radius: 10px; padding: 10px 14px; font-size: 0.8rem; color: #aedd88; }

  /* LISTS SECTION */
  .lists-section { max-width: 1300px; margin: 34px auto 0; padding-bottom: 10px; }
  .lists-section h2 { text-align: center; font-size: 1.1rem; font-weight: 900; color: var(--muted); margin-bottom: 18px; }
  .lists-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
  .workshop-list { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .wl-header {
    padding: 12px 15px; font-size: 0.9rem; font-weight: 900;
    border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 7px;
    cursor: pointer; transition: filter 0.2s;
  }
  .wl-header:hover { filter: brightness(1.1); }
  .wl-header.hw1 { background: #ff8906; color: #0f0e17; }
  .wl-header.hw2 { background: #3da9fc; color: #0f0e17; }
  .wl-header.hw3 { background: var(--t1); color: var(--t1t); }
  .wl-header.hw4 { background: var(--f1); color:
